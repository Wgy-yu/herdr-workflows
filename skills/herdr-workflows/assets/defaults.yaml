# 插件内置默认工作流：只包含逻辑默认值。
# Agent 本机命令和模型不写入共享默认配置，由用户全局配置管理。
default_workflow: default
workflows:
  default:
    template: development
    # 首次安装由 $herdr-workflows:init 让用户明确选择角色，不预设 Codex 或其他 Agent。
    leader: null
    implementer: null
    reviewer: null
    # Reviewer 对业务源码只读；review 模式仍可追加本轮共享 Markdown 评审单。
    reviewer_read_only: true
    # 是否在该工作流中执行 Superpowers Skill 与安装门禁。
    use_superpowers: true
    # 事件桥是 review/do 的强制完成通知通道，不允许关闭后退回等待或轮询。
    event_bridge_required: true
    structured_callbacks_required: true
    scope_checks_required: true
    final_decision_required: true
    # 最大返修 5 次，超过上限由 Leader 接管。
    max_rework: 5
    takeover_on_exceed: leader
    # 默认不轮换实施者与审查者；开启后由 Leader 只在阶段边界作决定。
    role_rotation:
      enabled: false
      interval_minutes: 120
      max_switches: 2
