version: 1
workflow_id: frontend-backend
template: frontend-backend
max_rework: 3
roles:
  leader:
    kind: leader
    writable_paths: []
  frontend:
    kind: implementer
    writable_paths:
      - src/frontend/**
  backend:
    kind: implementer
    writable_paths:
      - src/backend/**
  reviewer:
    kind: reviewer
    read_only: true
    writable_paths: []
phases:
  - id: design
    role: leader
    kind: design
    needs: []
    callback:
      type: plan
      required_fields: [plan_path, accepted]
  - id: frontend_implement
    role: frontend
    kind: implementation
    needs: [design]
    required_tests: [frontend-unit]
    callback:
      type: implementation_complete
      required_fields: [changed_files, test_results]
  - id: backend_implement
    role: backend
    kind: implementation
    needs: [design]
    required_tests: [backend-unit]
    callback:
      type: implementation_complete
      required_fields: [changed_files, test_results]
  - id: integration_review
    role: reviewer
    kind: review
    needs: [frontend_implement, backend_implement]
    join: true
    callback:
      type: review_complete
      required_fields: [verdict, findings]
  - id: rework
    role: leader
    kind: rework
    needs: [integration_review]
    callback:
      type: rework_decision
      required_fields: [required, instructions]
  - id: verify
    role: reviewer
    kind: verification
    needs: [rework]
    callback:
      type: verification_complete
      required_fields: [verdict, evidence]
  - id: decision
    role: leader
    kind: decision
    needs: [verify]
    protected: true
    callback:
      type: final_decision
      required_fields: [decision, rationale]
