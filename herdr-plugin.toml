id = "wgy.herdr-workflows-bridge"
name = "Herdr Native Workflow Engine"
version = "0.4.0"
min_herdr_version = "0.7.0"
description = "Run single-active template or custom DAG workflows through authenticated callbacks and Herdr lifecycle events."
platforms = ["linux", "macos", "windows"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "herdr-event-bridge.mjs"]

[[actions]]
id = "init"
title = "Initialize development workflow"
contexts = ["workspace"]
command = ["node", "herdr-workflow-init.mjs"]

[[actions]]
id = "init-development"
title = "Initialize development workflow"
contexts = ["workspace"]
command = ["node", "herdr-workflow-init.mjs"]

[[actions]]
id = "init-frontend-backend"
title = "Initialize frontend/backend workflow"
contexts = ["workspace"]
command = ["node", "herdr-workflow-init.mjs"]

[[actions]]
id = "init-review-only"
title = "Initialize review-only workflow"
contexts = ["workspace"]
command = ["node", "herdr-workflow-init.mjs"]

[[actions]]
id = "dispatch"
title = "Start native workflow"
contexts = ["workspace"]
command = ["node", "herdr-workflow-dispatch.mjs"]

[[actions]]
id = "callback"
title = "Submit structured workflow callback"
contexts = ["workspace"]
command = ["node", "herdr-workflow-callback.mjs"]

[[actions]]
id = "repair"
title = "Repair workflow projections from events"
contexts = ["workspace"]
command = ["node", "herdr-workflow-repair.mjs"]
